<!DOCTYPE html>
<html lang="{{ g.lang }}">
<head>
<script>
  // Applique le theme avant l'affichage pour eviter un flash du mauvais theme.
  (function () {
    try {
      var stored = localStorage.getItem("theme");
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (stored === "dark" || (!stored && prefersDark)) document.documentElement.classList.add("dark");
    } catch (e) {}
    document.documentElement.classList.add("js");
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ profile.full_name if profile else "Portfolio" }} - {{ profile.title if profile else "" }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ profile.tagline if profile else "" }}{% endblock %}">
<meta name="theme-color" content="#fbf7f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1620" media="(prefers-color-scheme: dark)">

<meta property="og:type" content="website">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.description() }}">
<meta property="og:url" content="{{ request.url }}">
{% if profile and profile.avatar_filename %}
<meta property="og:image" content="{{ url_for('static', filename='uploads/' + profile.avatar_filename, _external=True) }}">
{% endif %}
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,100&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">

{% if config.ANALYTICS_SCRIPT_SRC %}
<script defer data-domain="{{ config.ANALYTICS_SCRIPT_DOMAIN }}" src="{{ config.ANALYTICS_SCRIPT_SRC }}"></script>
{% endif %}

{% block head %}{% endblock %}
</head>
<body>
<a href="#main-content" class="skip-link">{{ t("skip") }}</a>
<div class="scroll-progress" aria-hidden="true"></div>
<div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

{% block body %}{% endblock %}

<script src="{{ url_for('static', filename='js/site.js') }}" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
